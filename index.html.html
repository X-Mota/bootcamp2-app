<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Países</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Explorador de Países 🌍</h1>
        <p>Digite o nome de um país em inglês (ex: Brazil, Japan, Canada) para descobrir seus dados.</p>
        
        <div class="busca">
            <input type="text" id="campo-busca" placeholder="Digite o nome do país...">
            <button id="botao-buscar">Buscar</button>
        </div>

        <section id="resultado" class="resultado-area">
            <!-- Os dados da API aparecerão aqui -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
