<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador de Séries</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🎬 Explorador de Séries</h1>
    <p>Digite o nome de uma série e veja pôster, sinopse, nota e mais.</p>
  </header>

  <main>
    <div class="busca">
      <input type="text" id="campo-busca" placeholder="Ex: breaking bad, friends, dark...">
      <button id="botao-buscar">Buscar</button>
    </div>

    <section id="resultado" class="resultado">
      <p class="dica">Faça uma busca para começar!</p>
    </section>

    <section id="favoritos">
      <h2>⭐ Meus favoritos</h2>
      <p id="status-favoritos" class="dica"></p>
      <ul id="lista-favoritos"></ul>
    </section>
  </main>

  <footer>
    <p>Dados fornecidos pela <a href="https://www.tvmaze.com/api" target="_blank">TVMaze API</a> · v1.0</p>
  </footer>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="favoritos.js"></script>
</body>
</html>
